services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: house_fastapi
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: house_streamlit
    ports:
      - "8501:8501"
    environment:
      API_URL: "http://fastapi:8000/predict"
    depends_on:
      - fastapi
